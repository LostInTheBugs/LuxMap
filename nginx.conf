server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The types directive REPLACES the whole default MIME table — list everything needed.
    types {
        text/html html htm;
        text/css css;
        text/plain txt;
        application/javascript js mjs;
        application/json json map;
        application/geo+json geojson;
        image/svg+xml svg svgz;
        image/x-icon ico;
        image/png png;
        image/webp webp;
        font/woff2 woff2;
        application/octet-stream bin;
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/geo+json image/svg+xml;
    gzip_min_length 1024;

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        # add_header in this location would otherwise drop the server-level
        # security headers on the HTML page (the one resource that needs them).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Fichiers au nom hashé par Vite : immuables.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Géométries : volumineuses, stables → cache court.
    location ~ \.geojson$ {
        add_header Cache-Control "public, max-age=86400";
    }

    # Données d'indicateurs : changent à CHAQUE release → jamais de cache
    # navigateur (sinon l'utilisateur garde l'ancien series.json 24 h et les
    # nouveaux indicateurs n'ont ni slider ni animation).
    location ~ \.json$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }
}
